name: Compilar APK y AAB

# Se ejecuta automáticamente cada vez que subes o cambias archivos,
# y también se puede lanzar a mano desde la pestaña "Actions" en GitHub.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Preparar la clave de firma (desde los "Secrets" del repositorio)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No hay KEYSTORE_BASE64 configurado todavía: se compilará sin firmar."
          fi

      - name: Compilar APK y AAB (versión release, firmada)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Subir el APK (para instalar directo en un celular)
        uses: actions/upload-artifact@v7
        with:
          name: EscanerPDF-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Subir el AAB (para subir a Play Console)
        uses: actions/upload-artifact@v7
        with:
          name: EscanerPDF-aab
          path: app/build/outputs/bundle/release/app-release.aab
